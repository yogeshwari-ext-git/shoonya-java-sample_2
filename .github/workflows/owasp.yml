name: OWASP Dependency Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Scan dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run OWASP Dependency-Check
        id: dependency-check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          nvd_options=()
          if [[ -n "${NVD_API_KEY}" ]]; then
            nvd_options+=("-DnvdApiKeyEnvironmentVariable=NVD_API_KEY")
          fi

          mvn --batch-mode --no-transfer-progress clean \
            org.owasp:dependency-check-maven:12.1.0:check \
            -Dformats=JSON,HTML \
            -Dodc.outputDirectory=target/dependency-check \
            -DfailBuildOnCVSS=11 \
            "${nvd_options[@]}"

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-service-owasp-reports-${{ github.sha }}
          path: |
            target/dependency-check/dependency-check-report.json
            target/dependency-check/dependency-check-report.html
          if-no-files-found: warn
          retention-days: 30

      - name: Report scan result
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.dependency-check.outcome }}
        shell: bash
        run: |
          json_report=target/dependency-check/dependency-check-report.json
          html_report=target/dependency-check/dependency-check-report.html

          if [[ "${SCAN_OUTCOME}" != "success" ]]; then
            echo "::error::OWASP Dependency-Check failed to run. This is not a zero-vulnerability result."
            exit 1
          fi

          if [[ ! -s "${json_report}" || ! -s "${html_report}" ]]; then
            echo "::error::OWASP Dependency-Check did not produce both required reports."
            exit 1
          fi

          vulnerability_count=$(jq '[.dependencies[]?.vulnerabilities[]?] | length' "${json_report}")
          if [[ "${vulnerability_count}" -eq 0 ]]; then
            echo "::notice::OWASP Dependency-Check completed successfully and found zero vulnerabilities."
          else
            echo "::error::OWASP Dependency-Check completed and found ${vulnerability_count} vulnerabilities."
            exit 1
          fi
